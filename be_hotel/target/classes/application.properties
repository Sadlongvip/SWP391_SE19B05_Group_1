server.port=8080
spring.application.name=be_hotel
# ====== Datasource (SQL Server) ======
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=hotel_booking_system;encrypt=false
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ====== JPA / Hibernate ======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.main.allow-bean-definition-overriding=true

# ============================================
# SECURITY CONFIGURATION
# ============================================

# Default user credentials (for development only)
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# JWT Configuration (if using JWT)
jwt.secret=your-secret-key-min-256-bits-long-change-this-in-production
jwt.expiration=86400000

# Session timeout (in seconds)
server.servlet.session.timeout=30m

# Security headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false